<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2933" />
    <title>Kano</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <ul id="list"></ul>
      <p id="empty" hidden>Nothing here.</p>

      <section id="settings" class="sheet" hidden>
        <label>Day resets at
          <input id="reset-time" type="time" />
        </label>
        <button type="button" id="export">Export all data</button>
        <button type="button" id="import">Import all data</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden />
        <p id="settings-message" hidden></p>
      </section>
    </main>

    <nav>
      <button id="new" type="button" aria-label="Create new item">+</button>
      <button type="button" data-tab="all" class="active">All</button>
      <button type="button" data-tab="recurring">Repeat</button>
      <button type="button" data-tab="oneoffs">One-offs</button>
      <button type="button" data-tab="later">Later</button>
      <button type="button" data-tab="history">History</button>
      <button type="button" data-tab="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
    </nav>

    <dialog id="complete-dialog">
      <div class="sheet">
        <p class="title"></p>
        <button type="button" class="primary" data-action="complete">Mark completed</button>
        <button type="button" data-action="cancel">Cancel</button>
      </div>
    </dialog>

    <dialog id="delete-dialog">
      <div class="sheet">
        <p class="title"></p>
        <button type="button" data-action="edit">Edit</button>
        <button type="button" data-action="tomorrow">Postpone to next day</button>
        <button type="button" id="skip" data-action="skip">Skip</button>
        <button type="button" data-action="later">Move to later</button>
        <div id="postpone">
          <label>Postpone until
            <input id="postpone-date" type="date" />
          </label>
          <button type="button" data-action="postpone">Postpone to date</button>
        </div>
        <button type="button" class="danger" data-action="delete">Delete</button>
        <button type="button" data-action="cancel">Cancel</button>
      </div>
    </dialog>

    <dialog id="later-dialog">
      <div class="sheet">
        <p class="title"></p>
        <button type="button" class="primary" data-action="activate">Activate</button>
        <button type="button" data-action="edit">Edit</button>
        <button type="button" class="danger" data-action="delete">Delete</button>
        <button type="button" data-action="cancel">Cancel</button>
      </div>
    </dialog>

    <dialog id="overwrite-dialog">
      <div class="sheet">
        <p class="title">Overwrite existing data?</p>
        <p class="text">All current items and history will be deleted and replaced by the imported file.</p>
        <button type="button" class="danger" data-action="overwrite">Overwrite</button>
        <button type="button" data-action="cancel">Cancel</button>
      </div>
    </dialog>

    <dialog id="create-dialog">
      <form id="create-form" class="sheet" method="dialog">
        <p class="title" id="create-title">New item</p>
        <label>Name
          <input name="name" required autocomplete="off" />
        </label>
        <label>Type
          <select name="type">
            <option value="other" selected>Other</option>
            <option value="computer">Computer</option>
            <option value="exercise">Exercise</option>
            <option value="admin">Admin</option>
            <option value="study">Study</option>
          </select>
        </label>
        <label>Importance
          <select name="importance">
            <option value="optional" selected>Optional</option>
            <option value="must">Must</option>
          </select>
        </label>
        <label>Frequency
          <select name="frequency">
            <option value="1" selected>Every day</option>
            <option value="2">Every 2nd day</option>
            <option value="3">Every 3rd day</option>
            <option value="4">Every 4th day</option>
            <option value="7">Every 7th day</option>
            <option value="14">Every 14th day</option>
            <option value="30">Every 30th day</option>
            <option value="0">One-off</option>
          </select>
        </label>
        <label data-for="0">Due date (optional)
          <input name="date" type="date" />
        </label>
        <label>Status
          <select name="status">
            <option value="open" selected>Open</option>
            <option value="later">Later</option>
          </select>
        </label>
        <button type="submit" class="primary" id="create-submit">Create</button>
        <button type="button" id="create-cancel">Cancel</button>
      </form>
    </dialog>
  </body>
</html>
